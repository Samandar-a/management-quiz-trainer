<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#020617;color:white;min-height:100vh;padding:16px}.wrap{max-width:940px;margin:auto}h1{margin:0;font-size:30px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}.badge,.card,.btn,select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)}.badge{padding:10px 14px;border-radius:18px}.controls{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;margin:14px 0}select,.btn{border-radius:15px;padding:13px;font-size:15px;color:white}.btn{cursor:pointer;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}option{color:#020617}.card{border-radius:26px;overflow:hidden}.bar{height:8px;background:rgba(255,255,255,.12)}.barin{height:8px;background:#22d3ee;width:0%;transition:.2s}.inner{padding:22px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.chip{font-size:14px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.12)}.blue{background:rgba(34,211,238,.18);color:#a5f3fc}.q{font-size:23px;font-weight:800;line-height:1.32;margin-bottom:20px}.opts{display:grid;gap:10px}.opt{text-align:left;display:flex;gap:12px;align-items:flex-start;width:100%;border-radius:18px;padding:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);color:white;font-weight:600;line-height:1.35}.letter{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.12);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;font-weight:800}.correct{background:rgba(34,197,94,.22)!important;border-color:#4ade80!important}.wrong{background:rgba(244,63,94,.22)!important;border-color:#fb7185!important}.res{display:none;margin-top:16px;padding:14px;border-radius:16px;line-height:1.45}.good{display:block;background:rgba(34,197,94,.18);border:1px solid rgba(74,222,128,.45)}.bad{display:block;background:rgba(244,63,94,.18);border:1px solid rgba(251,113,133,.45)}.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.primary{background:#22d3ee;color:#020617;border-color:#22d3ee}.yellow{background:#facc15;color:#020617;border-color:#facc15}.finish{text-align:center;padding:30px}.big{font-size:40px;font-weight:900;margin:8px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{background:rgba(255,255,255,.1);border-radius:18px;padding:15px}.stat b{display:block;font-size:28px}@media(max-width:650px){h1{font-size:27px}.controls,.stats{grid-template-columns:1fr}.q{font-size:21px}.inner{padding:17px}}</style>
</head><body><div class="wrap"><div class="top"><h1>Тренажёр</h1><div class="badge"><b id="total"></b></div></div><div class="controls"><select id="category"></select><button class="btn" id="shuffle">Перемешать</button><button class="btn" id="mistakesBtn">Ошибки: 0</button></div><div class="card" id="quiz"><div class="bar"><div class="barin" id="progress"></div></div><div class="inner"><div class="chips"><span class="chip blue" id="catChip"></span><span class="chip" id="numChip"></span><span class="chip" id="scoreChip"></span><span class="chip" id="accChip"></span></div><div class="q" id="question"></div><div class="opts" id="options"></div><div class="res" id="result"></div><div class="actions"><button class="btn primary" id="next" disabled>Дальше</button><button class="btn" id="showAnswer">Ответ</button><button class="btn" id="restart">Заново</button></div></div></div><div class="card finish" id="finish" style="display:none"><div class="big" id="finishTitle"></div><div class="stats"><div class="stat"><b id="fg"></b>верно</div><div class="stat"><b id="fb"></b>ошибки</div><div class="stat"><b id="fa"></b>итог</div></div><div class="actions" style="justify-content:center"><button class="btn primary" onclick="startNormal()">Заново</button><button class="btn yellow" onclick="startMistakes()">Ошибки</button><button class="btn" onclick="clearMistakes()">Очистить</button></div></div></div>
<script>
const QUESTIONS = [{"question": "Компания Dulat Со производит два вида продукции: Х и Y. Подробная информация об обоих видах продукции приведена ниже: Продукт Х | Продукт У: Цена продажи | 105$ | 136$ Материалы | 18$ | 16$ Трудовые затраты (10 долларов в час) | 30$ | 45$ Переменные накладные расходы | 12$ | 15$ Постоянные накладные расходы | 20$ | 25$ Прибыль на единицу | 25$ | 35$ Максимальный спрос (единиц) | 800 | 1 500 Компания выбрала оптимальный план производства для максимизации прибыли за месяц, исходя из 4 650 рабочих часов. Дополнительные 90 часов стали доступны по стандартной ставке 10 долларов в час. Какую дополнительную прибыль можно получить за месяц?", "options": ["1 250$", "1 300$", "1 350$", "1 200$"], "answer": "1 200$", "id": 1, "category": "Линейное программирование"}, {"question": "О линейном программировании были сделаны следующие утверждения: Теневая цена дефицитного ресурса - это увеличение вклада, которое можно получить, если приобрести еще одну единицу этого ресурса. Недефицитные ресурсы всегда имеют нулевой запас. Какое из вышеуказанных утверждений верно?", "options": ["только 1", "только 2", "ни 1, ни 2", "и 1, и 2"], "answer": "только 1", "id": 2, "category": "Линейное программирование"}, {"question": "Компания «Супер чистое» занимается чисткой матрасов и диванов. Она определяет свою цену продажи (на матрас), добавляя наценку в размере 30% к общей стоимости. Переменные затраты составляют 15 долларов за чистку одного матраса и 3 доллар за рекламу. Исходя из ожидаемого объема в 6 000 матрасов, фиксированные постоянные затраты на чистку ожидаются в размере 18 000 долларов. Сколько компания «Чистота» должна взимать за чистку одного матраса?", "options": ["21$", "18.13$", "27.30$", "15.60$"], "answer": "27.30$", "id": 3, "category": "Ценообразование"}, {"question": "e. 7.80$ Лицо, принимающее решения, которое использует критерий максимума для принятия решений, будет классифицировано как:", "options": ["Не склонное к риску", "Склонное к риску", "Нейтральное к риску", "Управляющее риском"], "answer": "Склонное к риску", "id": 4, "category": "Управленческий учёт"}, {"question": "Компания получила специальный заказ, для которого она рассматривает возможность использования материала X, который она хранила в своих запасах в течение некоторого времени. Этот запас в 1890 кг был куплен по цене 9 долларов за кг. Для специального заказа требуется 1500 кг материала Х. Если этот материал не будет использоваться для этого заказа, он будет продан по цене 5,5 доллара за кг. Текущая цена материала X составляет 8,5 доллара США за кг. Какова общая релевантная стоимость материала X для специального заказа?", "options": ["9435$", "10 395 $", "19 830$", "17 010$"], "answer": "10 395 $", "id": 5, "category": "Ценообразование"}, {"question": "Бюджеты для различных отделов или функций внутри организации известны как:", "options": ["Гибкие бюджеты", "Статичные (фиксированные) бюджеты", "Скользящие бюджеты", "Функциональные бюджеты"], "answer": "Функциональные бюджеты", "id": 6, "category": "Бюджетирование"}, {"question": "Текущая информация, касающаяся отдела С, выглядит следующим образом: Предельные (Маржинальные) затраты на единицу продукции 300 долларов США Трансфертная цена компонента $495 Общий объем производства и продаж компонентов в год 4 400 единиц Удельные постоянные расходы подразделения А в год 30 000 долл. США Компания «БРО» предложила продать компонент подразделению D по цене 420 долларов за единицу. Если Подразделение D примет это предложение, Подразделение С будет закрыто. Если подразделение D примет предложение компании «БРО», то тогда как это повлияет на годовую прибыль группы СУПЕР в целом?", "options": ["Увеличение на 498 000 долл. США", "Сокращение на 30 000 долл. США", "Увеличение на 528 000 долл. США", "Сокращение на 498 000 долл. США"], "answer": "Сокращение на 498 000 долл. США", "id": 7, "category": "Ценообразование"}, {"question": "Транспортное предприятие регулярно совершает определенное путешествие и установило, что стандартная стоимость топлива для каждой поездки составляет 35 литров топлива по цене 1.5 доллара за литр. Новое законодательство привело к изменению транспортного средства, используемого для поездки, и неожиданному росту цен на топливо. Ретроспективно принято решение о том, что стандартная стоимость поездки должна была составлять 27 литров по цене 2.80 доллара за литр. Рассчитайте пересмотренный гибкий бюджет, если поездка была совершена 60 раз за этот период.", "options": ["3 150$", "4 536$", "5 880$", "2 430$"], "answer": "4 536$", "id": 8, "category": "Бюджетирование"}, {"question": "Ниже приведена выдержка производственных и непроизводственных данных по продукту за один период: выручка от продаж 12 000 000 у.е., производственные затраты - 7 800 000 у.е. Общие административные расходы и расходы по реализации - 3 300 000 у.е. Сумма общих активов равна 6 000 000 у.е. и стоимость капитала равна 12%. Чему равна остаточная прибыль (RI) предприятия «ДУМАН»?", "options": ["612 000$", "180 000$", "108 000$", "720 000$"], "answer": "180 000$", "id": 9, "category": "ROI, RI"}, {"question": "Производственная компания использует функциональную калькуляцию себестоимости (АВС) для составления годового бюджета. По бюджету запланировано произвести 10 000 штук изделия «А» и 6 000 штук изделия «В». Изделие «А» изготавливается партиями в 400 штук, а изделие «В» партиями в 200 штук. Общие затраты по наладке оборудования для запуска партий на весь объем продукции составляет 605 000 тенге. Чему равны затраты по наладке оборудования на одно изделие «А»?", "options": ["60,5 тенге", "27,5 тенге", "55 тенге", "18,33 тенге"], "answer": "27,5 тенге", "id": 10, "category": "Бюджетирование"}, {"question": "Asher - это инвестиционный центр в составе компании Miran Co. Операционная прибыль Asher составляет 120 000 долларов, а операционные активы - 600 000 долларов. Стоимость капитала равна 14%. Предлагается инвестировать 75 000 долларов, что увеличит операционную прибыль на 9 500 долларов. Какова рентабельность инвестиций (ROI) для Asher с учетом и без учета предлагаемой инвестиции?", "options": ["До инвестиций: 20%, после инвестиций: 18%", "До инвестиций: 18%, после инвестиций: 19,2%", "До инвестиций: 19,2%, после инвестиций: 20%", "До инвестиций: 20%, после инвестиций: 19,2%"], "answer": "До инвестиций: 20%, после инвестиций: 19,2%", "id": 11, "category": "ROI, RI"}, {"question": "Одним из видов продукции, выпускаемых компанией, является продукт «Р», который продается по цене 80 долларов за единицу, при этом себестоимость материалов составляет 20 долларов за единицу, а прямые затраты на рабочую силу - 14 долларов за единицу. Общий годовой бюджет на прямые затраты на труд составляет 100 000 часов рабочего времени по ставке 24 долларов в час. Накладные расходы завода составляют 5 840 000 долларов в год. Компания рассматривает возможность внедрения системы учета пропускной способности. Она определила, что время работы оборудования является узким местом в производстве. Для производства одной единицы продукта «Р» требуется 0,02 часа времени работы оборудования. Максимальная пропускная способность оборудования составляет 8 000 часов в год. Каков коэффициент учета пропускной способности для продукта «Р»?", "options": ["5,98", "5,80", "6,10", "6,98"], "answer": "5,98", "id": 12, "category": "Бюджетирование"}, {"question": "Цена продажи продукта «G» установлена на уровне 2 200 долларов за единицу, а объем продаж на предстоящий год ожидается на уровне 2 400 единиц. В предстоящем году потребуется доходность в размере 25% от инвестиций (ROI) в продукт «G» в размере 2 000 000 долларов. Какова целевая себестоимость каждой единицы продукта «G»?", "options": ["1780,60$", "2100,80$", "1991,67$", "1882,68$"], "answer": "1991,67$", "id": 13, "category": "Ценообразование"}, {"question": "В связи с производством инновационного продукта возникли следующие затраты: Затраты на планирование и разработку концепции Затраты на тестирование Производственные затрат let category="Все",mode="normal",order=[],index=0,selected=null,score=0,answered=0;
let mistakes=JSON.parse(localStorage.getItem("management_quiz_mistakes")||"[]");
const el=id=>document.getElementById(id);
function save(){localStorage.setItem("management_quiz_mistakes",JSON.stringify(mistakes));el("mistakesBtn").textContent="Ошибки: "+mistakes.length}
function cats(){return ["Все",...Array.from(new Set(QUESTIONS.map(q=>q.category)))]}
function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function base(){if(mode==="mistakes"){let ids=new Set(mistakes.map(m=>m.id));let bad=QUESTIONS.filter(q=>ids.has(q.id));return bad.length?bad:QUESTIONS}return category==="Все"?QUESTIONS:QUESTIONS.filter(q=>q.category===category)}
function reset(m=mode){mode=m;index=0;selected=null;score=0;answered=0;order=sh(base());render()}
function startNormal(){reset("normal")}function startMistakes(){reset("mistakes")}function clearMistakes(){mistakes=[];save();reset("normal")}
function render(){save();el("finish").style.display="none";el("quiz").style.display="block";if(!order.length)order=sh(base());let q=order[index];let acc=answered?Math.round(score/answered*100):0;el("progress").style.width=Math.round(((index+(selected?1:0))/order.length)*100)+"%";el("catChip").textContent=q.category;el("numChip").textContent=(index+1)+" / "+order.length;el("scoreChip").textContent=score+" / "+answered;el("accChip").textContent=acc+"%";el("question").textContent=q.question;el("options").innerHTML="";sh(q.options).forEach((opt,i)=>{let b=document.createElement("button");b.className="opt";b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span>${opt}</span>`;b.onclick=()=>pick(opt);el("options").appendChild(b)});el("result").className="res";el("result").innerHTML="";el("next").disabled=true;el("next").textContent=index+1>=order.length?"Завершить":"Дальше";el("showAnswer").disabled=false}
function pick(ans){if(selected)return;selected=ans;answered++;let q=order[index];let ok=ans===q.answer;if(ok)score++;if(!ok&&!mistakes.some(m=>m.id===q.id))mistakes.push({id:q.id});show(ok)}
function show(ok){let q=order[index];document.querySelectorAll(".opt").forEach(b=>{let t=b.innerText.slice(1).trim();b.disabled=true;if(t===q.answer)b.classList.add("correct");if(t===selected&&t!==q.answer)b.classList.add("wrong")});let r=el("result");r.className="res "+(ok?"good":"bad");r.innerHTML=`<b>${ok?"Правильно ✅":"Неправильно ❌"}</b><br><b>${q.answer}</b>`;el("next").disabled=false;el("showAnswer").disabled=true;save();let acc=answered?Math.round(score/answered*100):0;el("scoreChip").textContent=score+" / "+answered;el("accChip").textContent=acc+"%"}
function fin(){el("quiz").style.display="none";el("finish").style.display="block";let bad=answered-score,acc=answered?Math.round(score/answered*100):0;el("finishTitle").textContent=acc>=85?"🔥":acc>=60?"Норм":"Повтори";el("fg").textContent=score;el("fb").textContent=bad;el("fa").textContent=acc+"%"}
el("next").onclick=()=>{if(index+1>=order.length)fin();else{index++;selected=null;render()}};
el("showAnswer").onclick=()=>{if(selected)return;selected=order[index].answer;answered++;score++;show(true)};
